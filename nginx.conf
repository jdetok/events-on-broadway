server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to Express
    location /api {
        proxy_pass http://api:6543;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Serve gallery and upload images from shared volume
    location /img/ {
        alias /data/img/;
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}